name: AMR++_env
channels:
  - bioconda
  - conda-forge
  - anaconda
dependencies:
  # --- core pipeline ---
  - python=3.9
  - bwa
  - samtools
  - bedtools
  - trimmomatic
  - fastqc
  - multiqc
  - git                  # build_dependencies clones the SNP tool at runtime

  # --- workflow-specific ---
  - flash                # merged-read workflow
  - bbmap                # provides clumpify.sh for read deduplication
  - seqkit               # read statistics
  - ngless>=1.5          # BAM filtering for metaSNV
  - metasnv>=2.0.1       # For SNV calling

  # --- microbiome (optional analyses) ---
  - kraken2

  # --- python libraries ---
  - numpy
  - pandas
  - matplotlib
  - pysam
  - biopython            # SNP verification tool (Bio.SeqIO)
  - python-duckdb        # coverage threshold evaluation; see note on package name

  # --- R, for the threshold evaluation drop-off plots ---
  - r-base
  - r-data.table
  - r-ggplot2
  - r-scales

