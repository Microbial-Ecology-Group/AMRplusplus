name: AMR++_SNV_env
channels:
  - conda-forge
  - bioconda
  - anaconda
dependencies:
  - nextflow
  # --- core pipeline ---
  - python=3.9
  - bwa
  # samtools 1.24 `mpileup -l` writes garbage reference bases across many contigs,
  # which crashes metaSNV's snpCaller. 1.19.2 is tested to work.
  - samtools=1.22.1

  # --- workflow-specific ---
  - ngless>=1.5          # BAM filtering for metaSNV
  - metasnv>=2.0.1       # For SNV calling

  # --- python libraries ---
  - numpy
  - pandas
